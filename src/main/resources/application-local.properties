server.port=8080

# Database Configuration (Local PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/quotation_db?currentSchema=quotation_master
spring.datasource.username=postgres
spring.datasource.password=8825
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=quotation_master
spring.flyway.schemas=quotation_master
spring.flyway.default-schema=quotation_master

# Development Tools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# JWT Configuration (Local Development - Simple Secret)
jwt.secret=mySecretKeyForJWTTokenGenerationThatIsLongEnough123ForLocalDevelopmentOnly
jwt.access-token-expiry=3600000
jwt.refresh-token-expiry=604800000

# Email Configuration (Local Development - Optional)
# If you want to test email functionality, configure these:
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
app.mail.from=your-email@gmail.com
app.mail.enabled=false

# SMS Configuration (Local - Mock/Log based for demo)
app.sms.enabled=true
sms.provider=mock

# Logging (Debug mode for development)
logging.level.com.satyam.quotation=DEBUG
logging.level.org.springframework.security=DEBUG
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true