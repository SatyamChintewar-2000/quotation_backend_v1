spring.application.name=Quotation
spring.profiles.active=local
server.port=${SERVER_PORT:8080}

# Logging - Use environment variable to control log level
logging.level.com.satyam.quotation=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Batch fetching: eliminates N+1 for @OneToMany collections (items, services)
# Hibernate will load up to 50 collections in a single IN(...) query instead of one query per row
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.batch_fetch_style=PADDED

# ── Caffeine in-memory cache ─────────────────────────────────────────────────
# Spring Cache is enabled via @EnableCaching in CacheConfig.java
# Cache entries are evicted automatically on every create/update/delete operation.
# TTL below is the safety-net expiry in case an eviction is ever missed.
#   quotations / invoices / enquiries : 2 min (data changes frequently)
#   customers / products / users      : 5 min (slower-changing master data)
#   dashboard / reports               : 1 min (stats, short TTL for freshness)
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=2m

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:quotation@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dummy}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${MAIL_FROM:quotation@gmail.com}
app.mail.from-name=Quotation System
app.mail.enabled=${MAIL_ENABLED:false}

# SMS provider settings for mobile OTP login
app.sms.enabled=${SMS_ENABLED:false}
sms.provider=${SMS_PROVIDER:twilio}
sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
sms.twilio.from-number=${TWILIO_FROM_NUMBER:}

jwt.secret=${JWT_SECRET:mySecretKeyForJWTTokenGenerationThatIsLongEnough123ForLocalDevelopmentOnly}
jwt.access-token-expiry=${JWT_ACCESS_TOKEN_EXPIRY:3600000}
jwt.refresh-token-expiry=${JWT_REFRESH_TOKEN_EXPIRY:604800000}

file.upload-dir=./uploads/quotations

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.task.scheduling.pool.size=5
app.scheduler.expiry-warning-days=3
app.scheduler.expiry-check-cron=0 0 9 * * ?